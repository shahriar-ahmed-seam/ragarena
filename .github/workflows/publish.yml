name: Publish to PyPI

# Fires when a release is published, or manually. Uses PyPI Trusted Publishing
# (OIDC) so no long-lived token is stored in the repository. Configure the
# publisher once at https://pypi.org/manage/project/ragarena/settings/publishing/
# with: owner=shahriar-ahmed-seam, repo=ragarena, workflow=publish.yml, environment=pypi
#
# To use an API token instead, add PYPI_API_TOKEN as a secret and set
# `password: ${{ secrets.PYPI_API_TOKEN }}` on the publish step.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Confirm the tag matches the package version
        if: github.event_name == 'release'
        run: |
          python -m pip install -e .
          version="$(python -c 'import ragarena; print(ragarena.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $tag does not match package version $version" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
