name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src

      - name: Typecheck
        run: python -m mypy src/ragarena

      - name: Validate bundled dataset labels
        run: ragarena validate --dataset meridian

      - name: Smoke test the pipeline with no API keys
        # The `hash` embedding provider is deterministic and offline, so the
        # whole retrieve -> generate -> score path is exercised in CI without
        # credentials or model downloads. Generation abstains without an LLM
        # key, which is the expected offline behaviour.
        run: |
          ragarena bench \
            --suite quick \
            --limit 4 \
            --no-judge \
            --embed-provider hash \
            --rerank-provider none \
            --out /tmp/ci-results
        continue-on-error: true

      - name: Import check
        run: python -c "import ragarena; print(ragarena.__version__)"

  package:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ragarena:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the image runs
        run: docker run --rm --entrypoint ragarena ragarena:ci validate --dataset meridian

  site:
    name: leaderboard site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Build
        working-directory: site
        run: npm run build
